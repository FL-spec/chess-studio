name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: development/package-lock.json
      - run: npm ci
      - name: Install Chromium
        run: |
          npx --yes playwright@1.65.1 install --with-deps chromium
          echo "CHESS_TEST_CHROME=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Run tests
        run: xvfb-run --auto-servernum npm test
